<!doctype html>
<html lang="es-PY">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#172033" />
    <title>Sin conexión — Pedidos Flash</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, #212e48 0%, #172033 65%, #0b111e 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(23, 32, 51, 0.92);
        border: 1px solid #26334d;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: block;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(239, 68, 68, 0.16);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ef4444;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .slogan {
        margin: 0 0 16px;
        color: #ff6b35;
        font-size: 13px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        width: 100%;
        min-height: 56px;
        border: none;
        border-radius: 14px;
        background: #ff6b35;
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.08s ease, background 0.15s ease;
      }
      button:hover {
        background: #e85a24;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 16px;
        margin-bottom: 0;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <svg
        class="logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
        fill="none"
        role="img"
        aria-label="Pedidos Flash"
      >
        <rect width="512" height="512" rx="112" fill="#0B111E" stroke="#26334D" stroke-width="12" />
        <path
          d="M108 328C108 246.26 174.26 180 256 180C337.74 180 404 246.26 404 328H108Z"
          fill="#FFFFFF"
        />
        <rect x="88" y="348" width="336" height="32" rx="16" fill="#FFFFFF" />
        <circle cx="256" cy="152" r="20" fill="#FFFFFF" />
        <path
          d="M286 116L194 268H262L226 404L334 236H264L286 116Z"
          stroke="#0B111E"
          stroke-width="24"
          stroke-linejoin="round"
        />
        <path
          d="M286 116L194 268H262L226 404L334 236H264L286 116Z"
          fill="#FF6B35"
        />
      </svg>

      <div class="badge" id="net-badge">
        <span class="dot"></span>
        <span>Sin conexión de red</span>
      </div>

      <h1>Pedidos Flash</h1>
      <p class="slogan">De la mesa a la cocina, en un flash.</p>
      <p>
        El dispositivo perdió conexión Wi-Fi o datos móviles. Tus mesas y comandas
        confirmadas están resguardadas y se resincronizarán automáticamente apenas
        vuelva la señal.
      </p>

      <button type="button" id="retry-btn">Reintentar ahora</button>
      <p class="hint" id="status-hint">
        Esperando reconexión automática con el servidor...
      </p>
    </main>

    <script>
      (function () {
        var btn = document.getElementById("retry-btn");
        var hint = document.getElementById("status-hint");

        function tryReload() {
          if (hint) {
            hint.textContent = "Verificando enlace con Pedidos Flash...";
          }
          fetch("/manifest.webmanifest", { cache: "no-store" })
            .then(function (res) {
              if (res.ok) {
                window.location.reload();
              }
            })
            .catch(function () {
              if (hint) {
                hint.textContent =
                  "Aún sin señal. Volveremos a intentar automáticamente...";
              }
            });
        }

        if (btn) {
          btn.addEventListener("click", tryReload);
        }
        window.addEventListener("online", tryReload);
        setInterval(function () {
          if (navigator.onLine) {
            tryReload();
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
